[package]
name = "gh-rag-core"
description = "Domain core: store / retrieval / embedder traits (no bin logic)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true

[features]
default = []
# API 黄金对齐测试开关(需网络 + GH_RAG_API_KEY;CI 无 key 不跑)
golden = []

[dependencies.ureq]
version = "2"
default-features = false
features = ["json", "tls"]

[dev-dependencies]
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[[example]]
name = "api_probe"
