name: ci

on:
  push:
    branches: [main, rust-rewrite, dev]
    paths:
      - "crates/**"
      - "tests/**"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "tests/**"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust-rewrite' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # rsproxy 镜像仅本地(中国网络)需要;runner 直连 crates.io 更快
      - name: Drop local cargo mirror config
        run: rm -f .cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test --workspace

  # API 黄金对齐需 GH_RAG_API_KEY(在线),不在常规 CI 跑:
  # - 本地:GH_RAG_API_KEY=xxx cargo test -p gh-rag-core --features golden
  # - ollama 端点对齐:手动触发 .github/workflows/ollama-align.yml
