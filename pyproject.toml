[project]
name = "gh-rag"
version = "0.1.0"
description = "Semantic memory layer over GitHub issues for AI agents (CLI + MCP)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "mcp>=1.2,<2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.scripts]
gh-rag = "gh_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_rag"]
